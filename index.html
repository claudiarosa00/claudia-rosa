<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Edita o título e a descrição: é o que aparece na pré-visualização do LinkedIn -->
  <title>Cláudia Rosa — Media Expert</title>
  <meta name="description" content="Cláudia Rosa, Media Expert na Arena Media Portugal. Estratégias de media integradas, dados e automação." />
  <meta property="og:title" content="Cláudia Rosa — Media Expert" />
  <meta property="og:description" content="Media Expert na Arena Media Portugal. Estratégias de media integradas, do planeamento à análise." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://claudia-rosa.vercel.app/og.png" />
  <meta property="og:url" content="https://claudia-rosa.vercel.app/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f5bea'/><text x='50' y='66' font-size='48' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>•</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a href="#topo" class="logo" id="logo"></a>
      <nav class="nav-links">
        <a href="#sobre">Sobre</a>
        <a href="#experiencia">Experiência</a>
        <a href="#competencias">Competências</a>
        <a href="#contacto">Contacto</a>
      </nav>
      <button class="theme" id="theme" aria-label="Mudar tema">◐</button>
    </div>
  </header>

  <main id="topo">
    <section class="hero wrap">
      <div class="hero-text reveal">
        <p class="badge" id="badge"><span class="dot"></span>Disponível para novas oportunidades</p>
        <h1 id="nome"></h1>
        <p class="cargo" id="cargo"></p>
        <p class="frase" id="frase"></p>
        <div class="ctas" id="ctas"></div>
      </div>
      <div class="avatar reveal" id="avatar"></div>
    </section>

    <section id="sobre" class="wrap section">
      <h2 class="reveal">Sobre mim</h2>
      <div class="sobre-grid">
        <div class="sobre-texto reveal" id="sobre-texto"></div>
        <div class="numeros reveal" id="numeros"></div>
      </div>
    </section>

    <section id="experiencia" class="wrap section">
      <h2 class="reveal">Experiência</h2>
      <ol class="timeline" id="timeline"></ol>
    </section>

    <section id="competencias" class="wrap section">
      <h2 class="reveal">Competências</h2>
      <div class="skills" id="skills"></div>
    </section>

    <section id="certificacoes" class="wrap section">
      <h2 class="reveal">Certificações</h2>
      <div class="certs" id="certs"></div>
    </section>

    <section id="recomendacao" class="wrap section">
      <figure class="quote reveal" id="quote"></figure>
    </section>

    <section id="projetos" class="wrap section">
      <h2 class="reveal">Projetos académicos</h2>
      <div class="cards" id="cards"></div>
    </section>

    <section id="formacao" class="wrap section">
      <h2 class="reveal">Formação & Idiomas</h2>
      <div class="formacao-grid">
        <ul class="formacao" id="formacao-lista"></ul>
        <ul class="idiomas reveal" id="idiomas"></ul>
      </div>
    </section>

    <section id="contacto" class="wrap section contacto reveal">
      <h2>Vamos conversar?</h2>
      <p>Estou sempre aberto a novos desafios, colaborações e uma boa conversa.</p>
      <div class="ctas center" id="ctas2"></div>
    </section>
  </main>

  <footer class="wrap footer" id="footer"></footer>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
